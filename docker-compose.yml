###############################################################################
# Benki Multi-Agent Crypto System — Docker Compose
# Active services: PostgreSQL + orchestrator + predictor + UI
###############################################################################

services:
  # ─── PostgreSQL (trade logs, P&L, risk audit) ───────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: benki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benki
      POSTGRES_USER: benki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - benki-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benki"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Benki Main (Orchestrator) ──────────────────────────────────────
  benki-main:
    image: nousresearch/hermes-agent:latest
    container_name: benki-main
    restart: unless-stopped
    user: "root"
    entrypoint: ["/bin/bash", "/opt/start-hermes-agent.sh"]
    env_file:
      - ./configs/main/.env
    environment:
      HERMES_HOME: /opt/data
      # Enable the Hermes HTTP API so benki-ui can poll /health
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
      API_SERVER_CORS_ORIGINS: "http://localhost:3000"
      HERMES_ALLOW_PRIVATE_URLS: "false"
      HERMES_REDACT_SECRETS: "true"
      HERMES_CRON_TIMEOUT: "0"
      HERMES_CRON_MAX_PARALLEL: "4"
      HERMES_CRON_STARTUP_DELAY_SECONDS: "90"
      HERMES_AGENT_TIMEOUT: "1800"
      SESSION_IDLE_MINUTES: "1440"
      # Feature toggles — passed to skills
      FEATURE_TRADING: ${FEATURE_TRADING:-false}
      FEATURE_PREDICTIONS: ${FEATURE_PREDICTIONS:-false}
    volumes:
      - main-data:/opt/data
      # Add new mount for cron loops
      - ./cron/main:/opt/data/cron
      # Plugin: risk_manager
      - ./plugins/risk-manager:/opt/data/plugins/risk-manager
      # Plugin: sentiment_parser
      - ./plugins/sentiment-parser:/opt/data/plugins/sentiment-parser
      # Plugin: db_client
      - ./plugins/db-client:/opt/data/plugins/db-client
      # Plugin: market_fetch (live prices + Kalshi, no API key required for discovery)
      - ./plugins/market-fetch:/opt/data/plugins/market-fetch
      # Config overlay
      - ./configs/main/config.yaml:/opt/config.yaml:ro
      - ./scripts/start-hermes-agent.sh:/opt/start-hermes-agent.sh:ro
      # Skills
      - ./skills/main:/opt/data/skills/custom
    networks:
      - benki-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Benki Trader (DeFi Execution) ──────────────────────────────────
  benki-trader:
    profiles: ["disabled"]
    image: nousresearch/hermes-agent:latest
    container_name: benki-trader
    restart: unless-stopped
    user: "root"
    entrypoint: ["/bin/bash", "/opt/start-hermes-agent.sh"]
    env_file:
      - ./configs/trader/.env
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
      API_SERVER_CORS_ORIGINS: "http://localhost:3000"
      HERMES_ALLOW_PRIVATE_URLS: "false"
      HERMES_REDACT_SECRETS: "true"
      HERMES_CRON_TIMEOUT: "0"
      HERMES_CRON_MAX_PARALLEL: "4"
      HERMES_CRON_STARTUP_DELAY_SECONDS: "150"
      HERMES_AGENT_TIMEOUT: "1800"
      SESSION_IDLE_MINUTES: "1440"
      # Feature toggles — passed to skills
      FEATURE_TRADING: ${FEATURE_TRADING:-false}
      FEATURE_PREDICTIONS: "false"
    volumes:
      - trader-data:/opt/data
      # Add new mount for cron loops
      - ./cron/trader:/opt/data/cron
      # Plugins
      - ./plugins/risk-manager:/opt/data/plugins/risk-manager
      - ./plugins/robinhood-mcp-client:/opt/data/plugins/robinhood-mcp-client
      - ./plugins/db-client:/opt/data/plugins/db-client
      # Plugin: market_fetch (prices for position management)
      - ./plugins/market-fetch:/opt/data/plugins/market-fetch
      # Config overlay
      - ./configs/trader/config.yaml:/opt/config.yaml:ro
      - ./scripts/start-hermes-agent.sh:/opt/start-hermes-agent.sh:ro
      # Skills
      - ./skills/trader:/opt/data/skills/custom
    networks:
      - benki-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Benki UI (Web Dashboard) ───────────────────────────────────
  benki-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: benki-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Must match the API_SERVER_KEY set on the agent services above
      API_SERVER_KEY: ${API_SERVER_KEY}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      GATEWAY_PORT: "8642"
      HEALTH_PATH: /health
      MAIN_HOST: benki-main
      PREDICTOR_HOST: benki-predictor
      TRADING_CHANNEL_ID: "1494494694057709789"
      PREDICTIONS_CHANNEL_ID: "1494494936182165705"
      # Feature toggles — control which markets are active
      FEATURE_TRADING: ${FEATURE_TRADING:-false}
      FEATURE_PREDICTIONS: ${FEATURE_PREDICTIONS:-false}
    networks:
      - benki-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ─── Benki Predictor (Prediction Markets) ───────────────────────────
  benki-predictor:
    image: nousresearch/hermes-agent:latest
    container_name: benki-predictor
    restart: unless-stopped
    user: "root"
    entrypoint: ["/bin/bash", "/opt/start-hermes-agent.sh"]
    env_file:
      - ./configs/predictor/.env
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
      API_SERVER_CORS_ORIGINS: "http://localhost:3000"
      HERMES_ALLOW_PRIVATE_URLS: "false"
      HERMES_REDACT_SECRETS: "true"
      HERMES_CRON_TIMEOUT: "0"
      HERMES_CRON_MAX_PARALLEL: "4"
      HERMES_CRON_STARTUP_DELAY_SECONDS: "210"
      HERMES_AGENT_TIMEOUT: "1800"
      SESSION_IDLE_MINUTES: "1440"
      # Feature toggles — passed to skills
      FEATURE_TRADING: "false"
      FEATURE_PREDICTIONS: ${FEATURE_PREDICTIONS:-false}
    volumes:
      - predictor-data:/opt/data
      # Add new mount for cron loops
      - ./cron/predictor:/opt/data/cron
      # Plugins
      - ./plugins/risk-manager:/opt/data/plugins/risk-manager
      - ./plugins/kalshi-client:/opt/data/plugins/kalshi-client
      - ./plugins/db-client:/opt/data/plugins/db-client
      # Config overlay
      - ./configs/predictor/config.yaml:/opt/config.yaml:ro
      - ./scripts/start-hermes-agent.sh:/opt/start-hermes-agent.sh:ro
      # Skills
      - ./skills/predictor:/opt/data/skills/custom
    networks:
      - benki-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  main-data:
  trader-data:
  predictor-data:

networks:
  benki-net:
    driver: bridge
